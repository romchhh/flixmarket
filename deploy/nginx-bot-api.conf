# Nginx на сервері БОТА: проксі /api/v1/* → localhost:8088
# Після: sudo ln -s .../nginx-bot-api.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# Сайт тоді в .env: BOT_API_URL=https://market.easyplayy.com
# Бот в .env:       PUBLIC_API_URL=https://market.easyplayy.com

server {
    listen 80;
    server_name market.easyplayy.com;

    # Мініапка / інший фронт — як було
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API бота (сайт flix-market.com ходить сюди з X-API-Key)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8088/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
